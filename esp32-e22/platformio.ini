; Board configuration for ESP32 + E22-900M30S (SX1262)
[env:esp32-e22]
extends = esp32_base
board = esp32dev
board_level = extra
build_flags =
  ${esp32_base.build_flags}
  -D PRIVATE_HW
  -I esp32-e22
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 921600
board_build.partitions = default.csv
